<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lotusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c2185b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#880e4f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lotus Petals -->
  <!-- Top petal -->
  <ellipse cx="100" cy="50" rx="25" ry="35" fill="url(#lotusGradient)" opacity="0.9"/>
  
  <!-- Top-right petal -->
  <ellipse cx="135" cy="70" rx="25" ry="35" fill="url(#lotusGradient)" opacity="0.8" transform="rotate(72 100 100)"/>
  
  <!-- Bottom-right petal -->
  <ellipse cx="135" cy="130" rx="25" ry="35" fill="url(#lotusGradient)" opacity="0.7" transform="rotate(144 100 100)"/>
  
  <!-- Bottom-left petal -->
  <ellipse cx="65" cy="130" rx="25" ry="35" fill="url(#lotusGradient)" opacity="0.8" transform="rotate(216 100 100)"/>
  
  <!-- Top-left petal -->
  <ellipse cx="65" cy="70" rx="25" ry="35" fill="url(#lotusGradient)" opacity="0.85" transform="rotate(288 100 100)"/>
  
  <!-- Center circle -->
  <circle cx="100" cy="100" r="20" fill="#e91e63"/>
  
  <!-- Inner highlight -->
  <circle cx="100" cy="95" r="8" fill="#ff1493" opacity="0.6"/>
</svg>
